# Render Blueprint: PostgreSQL + the bot.
#
# IMPORTANT — two supported runtime paths:
#
# 1) Docker (recommended, used by this Blueprint):
#    New + > Blueprint -> select this repo. Render builds the Dockerfile
#    (which compiles TypeScript in a build stage) and runs `node dist/src/index.js`.
#
# 2) Node (native) runtime — if your existing service is native Node,
#    set these two fields in Render > service > Settings:
#      Build Command: npm ci --include=dev --no-audit && npm run build
#      Start Command: node dist/src/index.js
#    (Render sets NODE_ENV=production, so --include=dev is required for
#     the TypeScript build; `node src/index.js` will NEVER work — the
#     source is TypeScript and compiles to dist/src/index.js.)
services:
  - type: web
    name: nexo-snipe-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: SOLANA_NETWORK
        value: devnet
      - key: SOLANA_MAINNET_ENABLED
        value: 'false'
      - key: MIN_SOL_BALANCE
        value: '3.0000'
      - key: LOG_LEVEL
        value: info
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nexo-snipe-db
          property: connectionString

databases:
  - name: nexo-snipe-db
    databaseName: hfive
    user: hfive
    plan: free
